<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap buttons with padding</title>
    <style>
        .get-started-button{
            background-color: rgb(121, 82, 179);
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            margin-right: 6px;
            font-weight: bold;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 20px;
            padding-right: 20px;
            transition: background-color 0.15s;
        }
        .get-started-button:hover{
            background-color: rgb(99, 60, 156);
        }

        .download-button{
            background-color: white;
            color: rgb(108, 117, 125);
            border-width: 1px;
            border-style: solid;
            border-color: rgb(108, 117, 125);
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 17px;
            padding-right: 17px;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.15s,
            color 0.15s;
        }
        .download-button:hover{
            background-color: rgb(108, 117, 125);
            color: white;
        }
    </style>
</head>
<body>
    <button class="get-started-button">Get started</button>
    <button class="download-button">Download</button>
</body>
</html>
