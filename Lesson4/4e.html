<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn buttons with padding</title>
    <style>
        .apply-button{
            background-color: rgb(10, 104, 197);
            color:white;
            cursor: pointer;
            border: none;
            border-radius: 20px;
            margin-right: 8px;
            font-weight: bold;
            font-size: 16px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 25px;
            padding-right: 25px;
            transition: background-color 0.15s;
        }

        .apply-button:hover{
            background-color: rgb(2, 70, 138);
        }

        .save-button{
            background-color: white;
            color:rgb(10, 102, 194);
            border-radius: 20px;
            cursor: pointer;
            border-color: rgb(10, 102, 194);
            border-width: 2px;
            border-style: double;
            font-weight: bold;
            font-size: 15px;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 25px;
            padding-right: 25px;
            transition: background-color 0.15s,
                border-width 0.15s,
                padding 0.16s;
        }
        .save-button:hover{
            background-color: rgb(226, 240, 254);
            border-width: 2px;
            padding-top: 9px;
            padding-bottom: 9px;
            padding-left: 24px;
            padding-right: 24px;
        }
    </style>
</head>
<body>
    <button class="apply-button">Apply on company website</button>
    <button class="save-button">Save</button>
</body>
</html>
