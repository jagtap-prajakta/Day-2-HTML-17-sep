<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub button with padding</title>
    <style>
        .github-button{
            background-color: rgb(46, 164, 79);
            color:white;
            font-weight: bold;
            border: none;
            font-size: 15px;
            border-radius: 7px;
            cursor: pointer;
            padding-top: 10px;
            padding-bottom: 10px;
            padding-left: 15px;
            padding-right: 15px;
            transition: box-shadow 0.15s;
        }

        .github-button:hover{
            box-shadow: 0px 5px 8px rgba(0, 0, 0, 0.16);
        }
    </style>
</head>
<body>
    <button class="github-button">Sign up</button>
</body>
</html>
