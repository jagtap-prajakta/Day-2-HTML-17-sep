<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>amazon button with padding</title>
    <style>
        .amazon-button{
            background-color: rgb(255, 216, 20);
            border: none;
            cursor: pointer;
            border-radius: 15px;
            padding-top: 8px;
            padding-bottom: 8px;
            padding-left: 30px;
            padding-right: 30px;

        }

        .amazon-button:hover{
            background-color: rgb(245, 205, 3);
        }
    </style>
</head>
<body>
    <button class="amazon-button">Add to Cart</button>
</body>
</html>
